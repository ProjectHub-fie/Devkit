navigationCompose = "2.7.7"
room = "2.6.1"
datastore = "1.1.1"
okhttp = "4.12.0"
serialization = "1.6.3"
coroutines = "1.8.1"
zxing = "3.5.3"
snakeyaml = "2.2"
commonmark = "0.22.0"
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"
